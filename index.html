<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MECSc Course Enquiry Chat</title>
<meta name="description" content="Ask about MECSc MCPC 1-4 cleaning courses: fees, dates, venue, registration. Bahasa Malaysia / English / 中文.">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#e5e7eb;display:flex;justify-content:center}
.app{width:100%;max-width:720px;height:100%;height:100dvh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.15)}
header{background:#1e40af;color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header p{margin:4px 0 0;font-size:12px;opacity:.9}
#msgs{flex:1;overflow-y:auto;padding:14px;background:#f3f4f6;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:9px 13px;border-radius:12px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{background:#fff;color:#1f2937;align-self:flex-start;border:1px solid #e5e7eb}
.m.user{background:#1e40af;color:#fff;align-self:flex-end}
.m.bot a{color:#1e40af}
#chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px;background:#f3f4f6}
#chips button{border:1px solid #1e40af;background:#fff;color:#1e40af;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb;background:#fff}
input{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:8px;padding:11px 12px;font-size:16px}
form button{background:#1e40af;color:#fff;border:0;border-radius:8px;padding:0 18px;font-size:15px;cursor:pointer}
form button:disabled,input:disabled{opacity:.6}
small{display:block;text-align:center;color:#6b7280;font-size:11px;padding:0 12px 10px;background:#fff}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MECSc Course Enquiry</h1>
    <p>Malaysian Cleaning Proficiency Course (MCPC 1-4) · Bahasa Malaysia / English / 中文</p>
  </header>
  <div id="msgs" aria-live="polite"></div>
  <div id="chips"></div>
  <form id="f">
    <input id="t" type="text" maxlength="500" autocomplete="off" aria-label="Message" placeholder="Type your question / Taip soalan / 请输入问题...">
    <button type="submit" id="s">Send</button>
  </form>
  <small>Answers are generated in your browser. Nothing is sent or stored. · www.mecsc.com.my</small>
</div>
<!-- Same logic as the floating widget; data-bubble="false" = expose window.MECSCChat only, no bubble -->
<script src="widget.js" data-bubble="false"></script>
<script>
(function () {
  var msgs = document.getElementById('msgs'), chips = document.getElementById('chips');
  var f = document.getElementById('f'), t = document.getElementById('t'), s = document.getElementById('s');
  var history = [], busy = false;

  function linkify(el, text) {
    String(text).split(/(https?:\/\/[^\s\u3000-\u303F\u3400-\u9FFF\uFF00-\uFFEF]+)/g).forEach(function (p) {
      if (/^https?:\/\//.test(p)) {
        var m = p.match(/^(.*?)([.,;:!?)\uFF0C\u3002\uFF09]*)$/);
        var a = document.createElement('a');
        a.href = m[1]; a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
        el.appendChild(a);
        if (m[2]) el.appendChild(document.createTextNode(m[2]));
      } else if (p) el.appendChild(document.createTextNode(p));
    });
  }
  function add(role, text) {
    var d = document.createElement('div'); d.className = 'm ' + role; linkify(d, text);
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
  }
  add('bot', "Hello! 👋 I'm the MECSc course assistant. Ask me about MCPC 1 to 4 fees, dates, venue, registration and HRD Corp.\nHelo! Tanya saya tentang yuran, tarikh dan pendaftaran kursus.\n您好！欢迎询问课程学费、日期和报名。");

  [['Fees', 'How much are the MCPC courses?'], ['Dates', 'What are the 2026 course dates?'],
   ['HRD Corp', 'Can I claim with HRD Corp?'], ['Yuran', 'Berapa yuran kursus MCPC?'],
   ['地点', '上课地点在哪里？']].forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = c[0];
    b.onclick = function () { send(c[1]); }; chips.appendChild(b);
  });

  function send(text) {
    text = (text || '').trim().slice(0, 500);
    if (!text || busy) return;
    busy = true; t.value = ''; t.disabled = s.disabled = true; chips.style.display = 'none';
    add('user', text);
    var w = add('bot', '...');
    window.MECSCChat.ask(text, history.slice(-8)).then(function (reply) {
      w.textContent = ''; linkify(w, reply);
      history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
      history = history.slice(-8);
    }).catch(function () {
      w.textContent = 'Sorry, something went wrong. Please WhatsApp 014-641 9310 or email training@mecsc.com.my.';
    }).then(function () {
      busy = false; t.disabled = s.disabled = false; msgs.scrollTop = msgs.scrollHeight; t.focus();
    });
  }
  f.addEventListener('submit', function (e) { e.preventDefault(); send(t.value); });
})();
</script>
</body>
</html>
